<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHH UI Prototype</title>
<!--
  Clickable prototype of the Whisper and LLM Providers pages, built on the tokens in DESIGN.md.
  Open it directly (`open prototype/index.html`), or serve the repo root
  (`python3 -m http.server` → http://localhost:8000/prototype/) so the bundled
  League Spartan file loads instead of the Google Fonts copy.
  Deep links: #whisper, #providers.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400..700&display=swap">
<style>
@font-face {
  font-family: "SHH Spartan";
  src: url("../SHH/Resources/Fonts/LeagueSpartan-VariableFont_wght.ttf") format("truetype");
  font-weight: 100 900;
  font-display: swap;
}

:root {
  /* DESIGN.md core palette */
  --sand: #F6F7EB;
  --stone-rgb: 57, 62, 65;
  --spice: #E94F37;

  /* Stillsuit Stone opacity tiers */
  --ink: rgb(var(--stone-rgb));
  --ink-2: rgba(var(--stone-rgb), .74);   /* secondary text: .6 misses 4.5:1 on sand */
  --ink-3: rgba(var(--stone-rgb), .5);
  --tone-card: rgba(var(--stone-rgb), .05);
  --tone-dig: rgba(var(--stone-rgb), .06);
  --tone-btn: rgba(var(--stone-rgb), .07);
  --tone-hover: rgba(var(--stone-rgb), .08);
  --tone-hairline: rgba(var(--stone-rgb), .10);
  --tone-stroke: rgba(var(--stone-rgb), .12);
  --tone-track: rgba(var(--stone-rgb), .14);
  --tone-selected: rgba(var(--stone-rgb), .15);
  --tone-off: rgba(var(--stone-rgb), .25);
  --tone-idle: rgba(var(--stone-rgb), .38);

  --font: "SHH Spartan", "League Spartan", ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: #D6D7D0;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ───────────── Stage + window chrome (not part of the app) ───────────── */

.stage {
  min-height: 100vh;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: center;
  gap: 24px;
  padding: 48px 24px;
}
.window {
  width: 800px;
  height: 578px;           /* 550pt content + 28pt title bar */
  min-width: 700px;
  min-height: 528px;
  resize: both;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  background: var(--sand);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .35), 0 24px 64px rgba(0, 0, 0, .22), 0 4px 12px rgba(0, 0, 0, .08);
}
.titlebar {
  flex: none;
  position: relative;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ECECEA;
  border-bottom: 1px solid rgba(0, 0, 0, .09);
  font-size: 13px;
  font-weight: 600;
  color: rgba(0, 0, 0, .78);
  user-select: none;
}
.lights { position: absolute; left: 12px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); }
.lights i:nth-child(1) { background: #FF5F57; }
.lights i:nth-child(2) { background: #FEBC2E; }
.lights i:nth-child(3) { background: #28C840; }

/* ───────────── App shell ───────────── */

.app {
  flex: 1;
  min-height: 0;
  display: flex;
  background: var(--sand);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
}
.app :focus-visible { outline: 2px solid rgba(var(--stone-rgb), .85); outline-offset: 2px; }
/* Re-renders restore focus programmatically; keep rings for keyboard users only. */
[data-input="pointer"] .app :focus-visible { outline: none; }
[data-input="pointer"] .ws-rail:focus-visible .ws-thumb { box-shadow: 0 0 0 .5px rgba(var(--stone-rgb), .25), 0 1px 2px rgba(0, 0, 0, .22); }
.i { flex: none; display: block; }

.sidebar {
  flex: none;
  width: 180px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .3s var(--ease);
}
.sidebar.is-collapsed { width: 64px; }
.side-head { flex: none; height: 52px; display: flex; align-items: center; }
.brand {
  flex: 1;
  padding-left: 20px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}
.is-collapsed .brand { display: none; }
.collapse-btn {
  flex: none;
  width: 44px;
  height: 44px;
  margin: 0 10px 0 auto;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 6px;
  background: none;
  color: rgba(var(--stone-rgb), .8);
  cursor: pointer;
}
.collapse-btn:hover { color: var(--ink); }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
.nav-bottom { margin-top: auto; padding-bottom: 16px; }
.nav-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 160px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 14px;
  line-height: 20px;
  color: rgba(var(--stone-rgb), .8);
  text-decoration: none;
  white-space: nowrap;
}
.is-collapsed .nav-row { width: 44px; }
.is-collapsed .nav-label { display: none; }
.nav-row:hover { background: var(--tone-hover); color: var(--ink); }
.nav-row[aria-current="page"] { background: var(--tone-selected); color: var(--spice); }
.nav-icon { flex: none; width: 20px; height: 20px; display: grid; place-items: center; }
.vrule { flex: none; width: 1px; background: var(--tone-stroke); }

.pane { flex: 1; min-width: 400px; min-height: 0; display: flex; flex-direction: column; }
.pane-header { flex: none; height: 52px; padding: 0 24px; display: flex; align-items: center; }
.pane-header h1 { margin: 0; font-size: 15px; font-weight: 700; }
.pane-divider { flex: none; height: 1px; background: rgba(0, 0, 0, .1); }
.pane-scroll { flex: 1; min-height: 0; overflow: auto; padding: 20px 24px 24px; }
.lede { margin: 0 0 14px; max-width: 60ch; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: 4px; }

.empty {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 24px;
  text-align: center;
}
.empty > .i { color: var(--tone-off); }
.empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
.empty p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink-2); }
.empty a { color: var(--ink); }

/* ───────────── Shared components ───────────── */

.card {
  position: relative;
  padding: 20px;
  border-radius: 8px;
  border: 1px solid var(--tone-hairline);
  background: var(--tone-card);
  transition: background-color .15s var(--ease);
}
.card:hover { background: var(--tone-hover); }

.title-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.title { font-size: 15px; font-weight: 500; line-height: 18px; white-space: nowrap; }
.meta { font-size: 11px; line-height: 14px; color: var(--ink-2); }

/* Status pill: static text, never clickable */
.badge {
  flex: none;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  line-height: 12px;
  background: var(--tone-hairline);
  color: var(--ink-2);
}
.badge.is-on { background: var(--spice); color: #fff; }

/* AppToggleStyle */
.switch {
  position: relative;
  flex: none;
  width: 38px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 11px;
  background: var(--tone-off);
  cursor: pointer;
  transition: background-color .15s ease-in-out;
}
.switch.is-on { background: var(--spice); }
.switch-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 1px rgba(0, 0, 0, .4), 0 1px 1px rgba(0, 0, 0, .15);
  transition: transform .15s ease-in-out;
}
.switch.is-on .switch-thumb { transform: translateX(16px); }
.switch[aria-disabled="true"] { opacity: .45; }

.btn {
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 6px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}
.btn-primary { background: var(--spice); color: #fff; font-weight: 600; }
.btn-primary:hover { filter: brightness(.95); }
.btn-secondary { background: var(--tone-btn); color: var(--ink-2); }
.btn-secondary:hover { background: var(--tone-hover); color: var(--ink); }

.icon-btn {
  flex: none;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--ink-2);
  cursor: pointer;
}
.icon-btn:hover { background: var(--tone-hover); color: var(--ink); }
.icon-btn[aria-expanded="true"] { background: var(--tone-selected); color: var(--ink); }

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 0;
  border: 0;
  background: none;
  font-size: 12px;
  color: var(--spice);
  cursor: pointer;
}

.spinner {
  flex: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1.5px solid var(--tone-idle);
  border-top-color: transparent;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ───────────── Whisper row ───────────── */

.wrow { container: wrow / inline-size; }
.wrow-main { display: flex; align-items: center; gap: 24px; }
.winfo { flex: none; width: 160px; display: flex; flex-direction: column; gap: 3px; }
.wtype { display: flex; align-items: baseline; gap: 4px; }
.wtype-name { font-size: 13px; font-weight: 600; line-height: 16px; }

/* Stepped model slider (Tiny → Large v3) */
.ws { --inset: 28px; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; user-select: none; }
.ws-ends {
  display: flex;
  justify-content: space-between;
  padding: 0 calc(var(--inset) - 12px);
  font-size: 10px;
  line-height: 12px;
  color: var(--ink-2);
}
.ws-rail { position: relative; height: 22px; border-radius: 11px; cursor: pointer; touch-action: none; }
.app .ws-rail:focus-visible { outline: none; }
.ws-rail:focus-visible .ws-thumb {
  box-shadow: 0 0 0 2px var(--sand), 0 0 0 4px rgba(var(--stone-rgb), .85), 0 1px 2px rgba(0, 0, 0, .22);
}
.ws-inner { position: absolute; inset: 0 var(--inset); }
.ws-track, .ws-fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; }
.ws-track { right: 0; background: var(--tone-track); }
.ws-fill { background: var(--spice); transition: width .14s var(--ease), background-color .15s var(--ease); }
.ws.is-pending .ws-fill,
.wrow.is-off .ws-fill { background: var(--tone-idle); }
.ws-stop {
  position: absolute;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--tone-idle);
}
/* Hollow stop = model not on disk (shape, not just color) */
.ws-stop:not(.is-ready) { background: var(--sand); box-shadow: inset 0 0 0 1.5px var(--tone-idle); }
.ws-stop.is-in.is-ready { background: rgba(255, 255, 255, .9); }
.ws-stop.is-in:not(.is-ready) { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .9); }
.ws-thumb {
  position: absolute;
  top: 50%;
  width: 18px;
  height: 18px;
  margin: -9px 0 0 -9px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fff;
  color: var(--ink-2);
  box-shadow: 0 0 0 .5px rgba(var(--stone-rgb), .25), 0 1px 2px rgba(0, 0, 0, .22);
  transition: left .14s var(--ease);
}
.ws-thumb .i { opacity: 0; transition: opacity .15s var(--ease); }
.ws.is-pending .ws-thumb .i { opacity: 1; }
.ws-labels { position: relative; height: 14px; }
.ws-label {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  font-size: 11px;
  line-height: 14px;
  white-space: nowrap;
  color: var(--ink-2);
  cursor: pointer;
}
.ws-label:hover { color: var(--ink); }
.ws-label.is-sel { color: var(--ink); font-weight: 600; }

@container wrow (max-width: 500px) {
  .wrow-main { flex-wrap: wrap; row-gap: 16px; }
  .winfo { flex: 1; width: auto; }
  .ws { order: 3; flex-basis: 100%; }
}

/* In-card notice: download prompt, progress, failure */
.notice {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 12px;
  border-radius: 6px;
  background: var(--tone-card);
  font-size: 13px;
}
.notice-icon { color: var(--ink-2); }
.notice-text { flex: 1; min-width: 0; margin: 0; line-height: 1.35; color: var(--ink-2); }
.notice-text.is-fit { flex: none; }
.notice-text strong { font-weight: 600; color: var(--ink); }
.notice-actions { flex: none; display: flex; gap: 8px; }
.progress { flex: 1; min-width: 80px; height: 4px; border-radius: 2px; overflow: hidden; background: var(--tone-track); }
.progress span { display: block; height: 100%; background: var(--spice); transition: width .1s linear; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ───────────── Provider rows ───────────── */

.prow { container: prow / inline-size; }
.prow-main { display: flex; align-items: center; gap: 12px; }
.prow-icon {
  flex: none;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 1px solid var(--tone-hairline);
  background: var(--tone-dig);
}
.prow-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.prow-meta { display: flex; align-items: center; gap: 4px; min-width: 0; }
.prow-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow-main .icon-btn { margin-right: -4px; }

.select-wrap { position: relative; flex: none; }
.select {
  width: 196px;
  height: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 0 12px;
  border-radius: 8px;
  border: 1px solid var(--tone-stroke);
  background: var(--tone-dig);
  font-size: 13px;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
}
.select:hover:not(:disabled) { background: var(--tone-hover); }
.select:disabled { cursor: default; }
.select.is-placeholder { color: var(--ink-2); }
.select-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select > .i { color: var(--ink-3); }

/* Floating "Mirage Glass" layer, same recipe as the StylePicker popup */
.menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 10;
  min-width: 100%;
  max-height: 240px;
  overflow-y: auto;
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--tone-stroke);
  background: rgba(246, 247, 235, .9);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
}
.menu.is-up { top: auto; bottom: calc(100% + 4px); }
.menu-item {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: none;
  font-size: 13px;
  line-height: 16px;
  text-align: left;
  white-space: nowrap;
  color: var(--ink);
  cursor: pointer;
}
.menu-item:hover, .menu-item:focus { background: var(--tone-hover); outline: none; }
.menu-item .check { color: var(--spice); visibility: hidden; }
.menu-item[aria-checked="true"] { font-weight: 600; }
.menu-item[aria-checked="true"] .check { visibility: visible; }
.menu-sep { height: 1px; margin: 4px 6px; background: var(--tone-stroke); }
.menu-foot { color: var(--ink-2); }

.pconfig { margin: 16px 0 0 44px; display: flex; flex-direction: column; gap: 12px; }
.pconfig-fields { display: grid; gap: 12px; }
.pconfig-fields.is-two { grid-template-columns: 1fr 1fr; }
.pconfig-actions { display: flex; align-items: center; justify-content: space-between; }
.field { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field-opt { font-weight: 400; }
.input {
  width: 100%;
  height: 34px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--tone-stroke);
  background: var(--tone-dig);
  font-size: 14px;
  color: var(--ink);
}
.input::placeholder { color: var(--ink-3); }
.app .input:focus-visible {
  outline: none;
  border-color: rgba(var(--stone-rgb), .45);
  box-shadow: 0 0 0 3px rgba(var(--stone-rgb), .12);
}

@container prow (max-width: 470px) {
  .select { width: 150px; }
  .pconfig { margin-left: 0; }
  .pconfig-fields.is-two { grid-template-columns: 1fr; }
}

/* ───────────── Prototype controls (not part of the app) ───────────── */

.proto {
  flex: none;
  width: 248px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .62);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12);
  font-size: 12px;
  line-height: 1.4;
  color: #333;
}
.proto h2 { margin: 0 0 2px; font-size: 13px; }
.proto .proto-sub { margin: 0 0 14px; color: #666; }
.proto fieldset { margin: 0 0 14px; padding: 0; border: 0; }
.proto legend {
  margin-bottom: 6px;
  padding: 0;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #777;
}
.proto label { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.proto .muted { color: #777; }
.proto p { margin: 0; }
.proto-btn {
  padding: 5px 12px;
  border: 0;
  border-radius: 6px;
  background: rgba(0, 0, 0, .07);
  font-size: 12px;
  cursor: pointer;
}
.proto-btn:hover { background: rgba(0, 0, 0, .11); }
.proto-keys { margin-top: 12px !important; color: #666; }
.proto kbd {
  padding: 0 4px;
  border-radius: 3px;
  background: rgba(0, 0, 0, .07);
  font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}
</style>
</head>
<body>
<main class="stage">
  <div class="window" id="window">
    <div class="titlebar"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>Shh..</div>
    <div class="app">
      <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
      <div class="vrule"></div>
      <section class="pane" id="pane"></section>
    </div>
  </div>
  <aside class="proto" id="proto" aria-label="Prototype controls"></aside>
</main>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
"use strict";

// ───────────── Data (mirrors KnownWhisperModel.catalog, smallest first) ─────────────

const MODELS = [
  { id: "tiny", name: "Tiny", bytes: 75e6, desc: "Fastest, lower accuracy" },
  { id: "base", name: "Base", bytes: 142e6, desc: "Fast, lightweight", bundled: true },
  { id: "small", name: "Small", bytes: 466e6, desc: "Good accuracy, faster" },
  { id: "medium", name: "Medium", bytes: 1528e6, desc: "Balanced accuracy & speed" },
  { id: "large-v3", name: "Large v3", bytes: 3094e6, desc: "Highest accuracy" },
];

// Stand-ins for GET /v1/models responses.
const MOCK_MODELS = {
  openai: ["gpt-5", "gpt-5-mini", "gpt-5-nano", "gpt-4.1", "gpt-4.1-mini", "gpt-4o-mini"],
  local: ["gemma-2-9b-it", "llama-3.1-8b-instruct", "mistral-7b-instruct-v0.3", "qwen2.5-7b-instruct"],
};
const MOCK_KEY = "sk-proj-demo-7c1e3f2a";

const NAV = {
  top: [["home", "Home", "house"], ["style", "Style", "brush"], ["providers", "Providers", "brain"], ["whisper", "Whisper", "cpu"]],
  bottom: [["settings", "Settings", "settings"], ["help", "Help", "help"]],
};
const ALL_NAV = [...NAV.top, ...NAV.bottom];

function pageFromHash() {
  const id = location.hash.slice(1);
  return ALL_NAV.some(([k]) => k === id) ? id : "whisper";
}

function initialState() {
  return {
    page: pageFromHash(),
    sidebarCollapsed: false,
    focusKey: null,
    whisper: {
      enabled: true,
      activeId: "small",
      selectedId: "small",
      downloaded: { tiny: false, base: true, small: true, medium: false, "large-v3": false },
      download: null, // { id, progress: 0…1, failed }
    },
    providers: {
      activeId: "openai",
      expandedId: null,
      openMenuId: null,
      list: [
        { id: "openai", name: "OpenAI", kind: "cloud", icon: "cloud", apiKey: MOCK_KEY, endpoint: "",

        { id: "local", name: "Local", kind: "local", icon: "server", apiKey: "", endpoint: "http://localhost:1234/v1",
          model: "qwen2.5-7b-instruct", models: [...MOCK_MODELS.local], loading: false, error: null, dirty: false },
      ],
    },
    sim: { failNextDownload: false, localReachable: true },

}

let S = initialState();
let dlTimer = null;
let drag = null;

// ───────────── Helpers ─────────────

const $ = (sel, root = document) => root.querySelector(sel);
const el = { sidebar: $("#sidebar"), pane: $("#pane"), proto: $("#proto"), live: $("#live"), window: $("#window") };

const byId = id => MODELS.find(m => m.id === id);
const idxOf = id => MODELS.findIndex(m => m.id === id);
const pct = i => (i / (MODELS.length - 1)) * 100;
const clampIdx = i => Math.max(0, Math.min(MODELS.length - 1, i));
const fmtBytes = b => (b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${Math.round(b / 1e6)} MB`);
const host = url => url.replace(/^https?:\/\//, "").replace(/\/+$/, "");
const provider = id => S.providers.list.find(p => p.id === id);
const isConfigured = p => (p.kind === "cloud" ? p.apiKey : p.endpoint).trim() !== "";
const canActivate = p => isConfigured(p) && !p.loading && !p.error && !!p.model;
const firstFieldKey = p => `in-${p.id}-${p.kind === "cloud" ? "apiKey" : "endpoint"}`;
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function announce(msg) {
  el.live.textContent = "";
  requestAnimationFrame(() => { el.live.textContent = msg; });
}

// Lucide paths, standing in for the app's SF Symbols.

function icon(name, size = 16, cls = "", stroke = 2) {
  return `<svg class="i ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[name]}</svg>`;
}

function statusBadge(on) {
  return on ? '<span class="badge is-on">Active</span>' : '<span class="badge">Inactive</span>';
}

function switchHTML(key, on, label, disabled, attrs) {
  return `<button class="switch${on ? " is-on" : ""}" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-key="${key}"${disabled ? ' aria-disabled="true"' : ""} ${attrs}><span class="switch-thumb"></span></button>`;
}

// ───────────── Render ─────────────

function render() {
  if (drag) return; // the slider is mid-drag; pointerup renders
  const focused = document.activeElement;
  const focusKey = S.focusKey ?? focused?.dataset?.key;
  S.focusKey = null;

  renderSidebar();
  renderPane();
  renderProto();

  if (focusKey) $(`[data-key="${CSS.escape(focusKey)}"]`)?.focus({ preventScroll: true });
  placeMenus();
}

function renderSidebar() {
  const collapsed = S.sidebarCollapsed;
  const row = ([id, label, ic]) => `
    <a class="nav-row" href="#${id}" data-key="nav-${id}"${S.page === id ? ' aria-current="page"' : ""}${collapsed ? ` title="${label}" aria-label="${label}"` : ""}>
      <span class="nav-icon">${icon(ic, 14)}</span><span class="nav-label">${label}</span>
    </a>`;
  el.sidebar.classList.toggle("is-collapsed", collapsed);
  el.sidebar.innerHTML = `
    <div class="side-head">
      <a class="brand" href="#home" data-key="brand">Shh..</a>
      <button class="collapse-btn" data-action="collapse" data-key="collapse" aria-label="${collapsed ? "Expand" : "Collapse"} sidebar">${icon("sidebar", 15)}</button>
    </div>
    <div class="nav">${NAV.top.map(row).join("")}</div>
    <div class="nav nav-bottom">${NAV.bottom.map(row).join("")}</div>`;
}

const PAGES = {
  whisper: { title: "Whisper", render: renderWhisper },
  providers: { title: "LLM Providers", render: renderProviders },
};

function renderPane() {
  const page = PAGES[S.page];
  const scroller = $(".pane-scroll", el.pane);
  const scrollTop = scroller && el.pane.dataset.page === S.page ? scroller.scrollTop : 0;
  el.pane.dataset.page = S.page;
  el.pane.innerHTML = `
    <header class="pane-header"><h1>${page ? page.title : ALL_NAV.find(([k]) => k === S.page)[1]}</h1></header>
    <div class="pane-divider"></div>
    <div class="pane-scroll">${page ? page.render() : placeholder(S.page)}</div>`;
  $(".pane-scroll", el.pane).scrollTop = scrollTop;
}

function placeholder(id) {
  const [, label, ic] = ALL_NAV.find(([k]) => k === id);
  return `
    <div class="empty">
      ${icon(ic, 36, "", 1.5)}
      <h2>${label}</h2>
      <p>Not part of this redesign.<br>Open <a href="#whisper">Whisper</a> or <a href="#providers">Providers</a>.</p>
    </div>`;
}

// ───────────── Whisper page ─────────────

function renderWhisper() {
  const w = S.whisper;
  const i = idxOf(w.selectedId);
  const m = MODELS[i];
  return `
    <p class="lede">Speech-to-text runs on this Mac. Bigger models are more accurate, but slower and larger on disk.</p>
    <div class="stack">
      <article class="card wrow${w.enabled ? "" : " is-off"}" aria-label="Whisper">
        <div class="wrow-main">
          <div class="winfo">
            <div class="title-line"><span class="title">Whisper</span>${statusBadge(w.enabled)}</div>
            <div class="wtype">
              <span class="wtype-name" data-ref="type">${m.name}</span>
              <span class="meta" data-ref="size">· ${fmtBytes(m.bytes)}</span>
            </div>
            <div class="meta" data-ref="desc">${whisperDesc(m)}</div>
          </div>
          ${whisperSlider(i)}
          ${switchHTML("whisper-switch", w.enabled, "Whisper active", false, 'data-action="whisper-toggle"')}
        </div>
        ${whisperNotice()}
      </article>
    </div>`;
}

function whisperDesc(m) {
  const w = S.whisper;
  if (w.downloaded[m.id]) return esc(m.desc);
  const downloading = w.download && w.download.id === m.id && !w.download.failed;
  return `${downloading ? "Downloading" : "Not downloaded"} · using ${byId(w.activeId).name}`;
}

function sliderText(i) {
  const m = MODELS[i];
  return `${m.name}, ${fmtBytes(m.bytes)}${S.whisper.downloaded[m.id] ? "" : ", not downloaded"}`;
}

function whisperSlider(sel) {
  const w = S.whisper;
  const stops = MODELS.map((m, j) =>
    `<span class="ws-stop${w.downloaded[m.id] ? " is-ready" : ""}${j < sel ? " is-in" : ""}" style="left:${pct(j)}%"></span>`).join("");
  const labels = MODELS.map((m, j) =>
    `<span class="ws-label${j === sel ? " is-sel" : ""}" data-idx="${j}" style="left:${pct(j)}%">${m.name}</span>`).join("");
  return `
    <div class="ws${w.downloaded[MODELS[sel].id] ? "" : " is-pending"}" id="ws">
      <div class="ws-ends" aria-hidden="true"><span>Faster</span><span>More accurate</span></div>
      <div class="ws-rail" role="slider" tabindex="0" data-key="ws" aria-label="Model size"
        aria-valuemin="0" aria-valuemax="${MODELS.length - 1}" aria-valuenow="${sel}" aria-valuetext="${sliderText(sel)}">
        <div class="ws-inner">
          <span class="ws-track"></span>
          <span class="ws-fill" style="width:${pct(sel)}%"></span>
          ${stops}
          <span class="ws-thumb" style="left:${pct(sel)}%">${icon("download", 10, "", 2.5)}</span>
        </div>
      </div>
      <div class="ws-labels" aria-hidden="true"><div class="ws-inner">${labels}</div></div>
    </div>`;
}

// Moves the slider without rebuilding the DOM, so drags and keyboard steps animate.
function paintSlider(i) {
  const ws = $("#ws");
  if (!ws) return;
  const m = MODELS[i];
  $(".ws-thumb", ws).style.left = `${pct(i)}%`;
  $(".ws-fill", ws).style.width = `${pct(i)}%`;
  ws.querySelectorAll(".ws-stop").forEach((s, j) => s.classList.toggle("is-in", j < i));
  ws.querySelectorAll(".ws-label").forEach((l, j) => l.classList.toggle("is-sel", j === i));
  ws.classList.toggle("is-pending", !S.whisper.downloaded[m.id]);
  const rail = $(".ws-rail", ws);
  rail.setAttribute("aria-valuenow", i);
  rail.setAttribute("aria-valuetext", sliderText(i));
  $('[data-ref="type"]').textContent = m.name;
  $('[data-ref="size"]').textContent = `· ${fmtBytes(m.bytes)}`;
  $('[data-ref="desc"]').innerHTML = whisperDesc(m);
}

function commitWhisper(i) {
  const w = S.whisper;
  const m = MODELS[i];
  S.focusKey = "ws";
  if (w.selectedId !== m.id) {
    w.selectedId = m.id;
    if (w.downloaded[m.id]) {
      w.activeId = m.id;
      announce(`Using ${m.name}`);
    } else {
      announce(`${m.name} isn't downloaded. Download ${fmtBytes(m.bytes)}?`);
    }
  }
  paintSlider(i);
  clearTimeout(commitWhisper.t);
  commitWhisper.t = setTimeout(render, reducedMotion() ? 0 : 150);
}

function whisperNotice() {
  const w = S.whisper;
  const m = byId(w.selectedId);
  const d = w.download;

  if (!w.downloaded[m.id] && !(d && d.id === m.id)) {
    return `
      <div class="notice" role="group" aria-label="Download ${m.name}">
        ${icon("download", 14, "notice-icon")}
        <p class="notice-text"><strong>${m.name}</strong> isn't downloaded yet (${fmtBytes(m.bytes)}). ${byId(w.activeId).name} stays in use until it's ready.</p>
        <div class="notice-actions">
          <button class="btn btn-secondary" data-action="dl-dismiss" data-key="dl-dismiss">Not now</button>
          <button class="btn btn-primary" data-action="dl-start" data-key="dl-start">Download</button>
        </div>
      </div>`;
  }
  if (d && d.failed) {
    return `
      <div class="notice" role="alert">
        ${icon("alert", 14, "notice-icon")}
        <p class="notice-text"><strong>${byId(d.id).name}</strong> didn't finish downloading. Check your connection and try again.</p>
        <div class="notice-actions">
          <button class="btn btn-secondary" data-action="dl-dismiss" data-key="dl-dismiss">Dismiss</button>
          <button class="btn btn-primary" data-action="dl-retry" data-key="dl-retry">Retry</button>
        </div>
      </div>`;
  }
  if (d) {
    const name = byId(d.id).name;
    return `
      <div class="notice">
        ${icon("download", 14, "notice-icon")}
        <p class="notice-text is-fit">Downloading <strong>${name}</strong></p>
        <div class="progress" id="dl-prog" role="progressbar" aria-label="${name} download"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(d.progress * 100)}"><span id="dl-bar" style="width:${d.progress * 100}%"></span></div>
        <span class="meta num" id="dl-bytes">${progressText(d)}</span>
        <button class="icon-btn" data-action="dl-abort" data-key="dl-abort" aria-label="Cancel download" title="Cancel download">${icon("x", 14)}</button>
      </div>`;
  }
  return "";
}

function progressText(d) {
  const total = byId(d.id).bytes;
  return `${fmtBytes(total * d.progress)} of ${fmtBytes(total)}`;
}

function startDownload(id) {
  const w = S.whisper;
  const m = byId(id);
  clearInterval(dlTimer);
  const failAt = S.sim.failNextDownload ? 0.35 + Math.random() * 0.3 : null;
  S.sim.failNextDownload = false;
  w.download = { id, progress: 0, failed: false };
  const step = 100 / (1400 + (m.bytes / 1e9) * 1600); // ~1.5 s for Tiny, ~6 s for Large v3

  dlTimer = setInterval(() => {
    const d = w.download;
    if (!d || d.id !== id || d.failed) return clearInterval(dlTimer);
    d.progress = Math.min(1, d.progress + step);
    if (failAt !== null && d.progress >= failAt) {
      d.failed = true;
      clearInterval(dlTimer);
      announce(`${m.name} download failed`);
      render();
    } else if (d.progress >= 1) {
      clearInterval(dlTimer);
      w.download = null;
      w.downloaded[id] = true;
      const inUse = w.selectedId === id;
      if (inUse) w.activeId = id;
      announce(`${m.name} downloaded${inUse ? ", now in use" : ""}`);
      render();
    } else {
      paintProgress(d);
    }
  }, 100);

  announce(`Downloading ${m.name}`);
  S.focusKey = "dl-abort";
  render();
}

function paintProgress(d) {
  const bar = $("#dl-bar");
  if (!bar) return;
  bar.style.width = `${d.progress * 100}%`;
  $("#dl-prog").setAttribute("aria-valuenow", Math.round(d.progress * 100));
  $("#dl-bytes").textContent = progressText(d);
}

// ───────────── Providers page ─────────────

function renderProviders() {
  return `
    <p class="lede">The active provider post-processes your transcripts. Only one provider can be active at a time.</p>
    <div class="stack">${S.providers.list.map(providerRow).join("")}</div>`;
}

function providerRow(p) {
  const P = S.providers;
  const active = P.activeId === p.id;
  const expanded = P.expandedId === p.id;
  const blocked = !canActivate(p);
  return `
    <article class="card prow" aria-label="${p.name}">
      <div class="prow-main">
        <span class="prow-icon">${icon(p.icon, 16)}</span>
        <div class="prow-info">
          <div class="title-line"><span class="title">${p.name}</span>${active ? statusBadge(true) : ""}</div>
          <div class="meta prow-meta">${providerMeta(p)}</div>
        </div>
        ${modelSelect(p)}
        <button class="icon-btn" data-action="configure" data-id="${p.id}" data-key="cfg-${p.id}"
          aria-expanded="${expanded}" aria-controls="cfgpanel-${p.id}" aria-label="${p.name} connection settings" title="Connection settings">${icon("sliders", 15)}</button>
        ${switchHTML(`switch-${p.id}`, active, `${p.name} active`, blocked,
          `data-action="provider-toggle" data-id="${p.id}"${blocked ? ` title="${isConfigured(p) ? "Needs a working connection" : "Add connection details first"}"` : ""}`)}
      </div>
      ${expanded ? providerConfig(p) : ""}
    </article>`;
}

function providerMeta(p) {
  if (p.loading) return "<span>Fetching models…</span>";
  if (!isConfigured(p)) return `${icon("alert", 11)}<span>${p.kind === "cloud" ? "Needs an API key" : "Needs an endpoint URL"}</span>`;
  if (p.error) return `${icon("alert", 11)}<span>${esc(p.error)}</span>`;
  const where = p.kind === "cloud" ? `Key ••••${esc(p.apiKey.slice(-4))}` : esc(host(p.endpoint));
  return `<span>${where} · ${p.models.length} models</span>`;
}

function modelSelect(p) {
  const open = S.providers.openMenuId === p.id;
  const ready = isConfigured(p) && !p.loading && p.models.length > 0;
  let label = p.model || "Choose a model";
  if (p.loading) label = "Loading models…";
  else if (!isConfigured(p)) label = p.kind === "cloud" ? "Add an API key…" : "Add an endpoint…";
  else if (!p.models.length) label = "No models found";
  return `
    <div class="select-wrap">
      <button class="select${ready && p.model ? "" : " is-placeholder"}" data-action="menu" data-id="${p.id}" data-key="select-${p.id}"
        aria-haspopup="menu" aria-expanded="${open}" aria-label="${p.name} model: ${esc(label)}" title="${esc(label)}"${p.loading ? " disabled" : ""}>
        <span class="select-label">${esc(label)}</span>${p.loading ? '<span class="spinner" aria-hidden="true"></span>' : icon("chevron", 12)}
      </button>
      ${open ? modelMenu(p) : ""}
    </div>`;
}

function modelMenu(p) {
  const items = p.models.map((m, i) => `
    <button class="menu-item" role="menuitemradio" aria-checked="${m === p.model}" tabindex="-1"
      data-action="pick" data-id="${p.id}" data-model="${esc(m)}" data-key="opt-${p.id}-${i}">
      ${icon("check", 13, "check", 2.5)}<span>${esc(m)}</span>
    </button>`).join("");
  return `
    <div class="menu" role="menu" aria-label="${p.name} models">
      ${items}
      <div class="menu-sep" role="separator"></div>
      <button class="menu-item menu-foot" role="menuitem" tabindex="-1" data-action="refresh" data-id="${p.id}" data-key="opt-${p.id}-refresh">
        ${icon("refresh", 13)}<span>Refresh models</span>
      </button>
    </div>`;
}

function providerConfig(p) {
  const cloud = p.kind === "cloud";
  const keyField = cloud ? `
    <label class="field">
      <span class="field-label">API key</span>
      <input class="input" type="password" value="${esc(p.apiKey)}" placeholder="sk-…" autocomplete="off" spellcheck="false"
        data-field="apiKey" data-id="${p.id}" data-key="in-${p.id}-apiKey">
    </label>` : "";
  return `
    <div class="pconfig" id="cfgpanel-${p.id}">
      <div class="pconfig-fields${cloud ? " is-two" : ""}">
        ${keyField}
        <label class="field">
          <span class="field-label">Endpoint URL${cloud ? ' <span class="field-opt">(optional)</span>' : ""}</span>
          <input class="input" type="url" value="${esc(p.endpoint)}" placeholder="${cloud ? "https://api.openai.com" : "http://localhost:1234/v1"}" autocomplete="off" spellcheck="false"
            data-field="endpoint" data-id="${p.id}" data-key="in-${p.id}-endpoint">
        </label>
      </div>
      <div class="pconfig-actions">
        <button class="link-btn" data-action="refresh" data-id="${p.id}" data-key="fetch-${p.id}">${icon("refresh", 12)} Fetch models</button>
        <button class="btn btn-secondary" data-action="done" data-id="${p.id}" data-key="done-${p.id}">Done</button>
      </div>
    </div>`;
}

function fetchModels(id) {
  const p = provider(id);
  p.dirty = false;
  S.providers.openMenuId = null;
  clearTimeout(p.timer);
  if (!isConfigured(p)) {
    Object.assign(p, { models: [], model: "", error: null, loading: false });
    if (S.providers.activeId === id) S.providers.activeId = null;
    render();
    return;
  }
  p.loading = true;
  p.error = null;
  render();
  p.timer = setTimeout(() => {
    p.loading = false;
    if (p.kind === "local" && !S.sim.localReachable) {
      p.models = [];
      p.error = `Can't reach ${host(p.endpoint)}`;
      if (S.providers.activeId === id) S.providers.activeId = null;
      announce(`${p.name}: ${p.error}`);
    } else {
      p.models = [...MOCK_MODELS[id]];
      if (!p.models.includes(p.model)) p.model = p.models[0];
      announce(`${p.name}: ${p.models.length} models available`);
    }
    render();
  }, 700);
}

function openMenu(id) {
  const p = provider(id);
  if (!isConfigured(p) || !p.models.length) {
    S.providers.expandedId = id;
    S.focusKey = firstFieldKey(p);
    render();
    return;
  }
  S.providers.openMenuId = id;
  S.focusKey = `opt-${id}-${Math.max(0, p.models.indexOf(p.model))}`;
  render();
}

// Closes without a re-render so a click that started on another control still lands.
function closeMenus(refocus) {
  const id = S.providers.openMenuId;
  if (!id) return;
  S.providers.openMenuId = null;
  document.querySelectorAll(".menu").forEach(m => m.remove());
  document.querySelectorAll('.select[aria-expanded="true"]').forEach(b => b.setAttribute("aria-expanded", "false"));
  if (refocus) $(`[data-key="select-${id}"]`)?.focus();
}

function placeMenus() {
  const scroller = $(".pane-scroll");
  document.querySelectorAll(".menu").forEach(menu => {
    if (menu.getBoundingClientRect().bottom > scroller.getBoundingClientRect().bottom - 8) menu.classList.add("is-up");
  });
}

// ───────────── Switches: animate in place, then re-render ─────────────

function switchWanted(key) {
  if (key === "whisper-switch") return S.whisper.enabled;
  if (key.startsWith("switch-")) return S.providers.activeId === key.slice(7);
}

function commitSwitches() {
  let moved = false;
  document.querySelectorAll(".switch[data-key]").forEach(sw => {
    const want = switchWanted(sw.dataset.key);
    if (want === undefined || want === sw.classList.contains("is-on")) return;
    sw.classList.toggle("is-on", want);
    sw.setAttribute("aria-checked", String(want));
    moved = true;
  });
  clearTimeout(commitSwitches.t);
  if (moved && !reducedMotion()) commitSwitches.t = setTimeout(render, 160);
  else render();
}

// ───────────── Prototype controls ─────────────

function renderProto() {
  const w = S.whisper;
  el.proto.innerHTML = `
    <h2>Prototype controls</h2>
    <p class="proto-sub">Simulate states. Not part of the app.</p>
    <fieldset>
      <legend>Whisper models on disk</legend>
      ${MODELS.map(m => `
        <label><input type="checkbox" data-sim="downloaded" data-id="${m.id}" data-key="sim-dl-${m.id}"${w.downloaded[m.id] ? " checked" : ""}${m.bundled ? " disabled" : ""}>
          ${m.name}${m.bundled ? ' <span class="muted">bundled</span>' : ""}</label>`).join("")}
      <label><input type="checkbox" data-sim="fail" data-key="sim-fail"${S.sim.failNextDownload ? " checked" : ""}> Next download fails</label>
    </fieldset>
    <fieldset>
      <legend>Providers</legend>
      <label><input type="checkbox" data-sim="key" data-key="sim-key"${provider("openai").apiKey ? " checked" : ""}> OpenAI key saved</label>
      <label><input type="checkbox" data-sim="local" data-key="sim-local"${S.sim.localReachable ? " checked" : ""}> Local server reachable</label>
    </fieldset>
    <fieldset>
      <legend>Window</legend>
      <p class="muted">Drag the bottom-right corner to resize. <span id="win-size" class="num"></span></p>
    </fieldset>
    <button class="proto-btn" data-action="proto-reset" data-key="sim-reset">Reset all</button>
    <p class="proto-keys">Slider: drag, click a label, or focus it and press <kbd>←</kbd> <kbd>→</kbd>.</p>`;
  updateWinSize();
}

function updateWinSize() {
  const out = $("#win-size");
  if (!out) return;
  const r = el.window.getBoundingClientRect();
  out.textContent = `(${Math.round(r.width)} × ${Math.round(r.height) - 28})`;
}

// ───────────── Events ─────────────

const ACTIONS = {
  collapse() {
    S.sidebarCollapsed = !S.sidebarCollapsed;
    render();
  },
  "whisper-toggle"() {
    S.whisper.enabled = !S.whisper.enabled;
    announce(`Whisper ${S.whisper.enabled ? "active" : "inactive"}`);
    commitSwitches();
  },
  "dl-start"() { startDownload(S.whisper.selectedId); },
  "dl-retry"() { startDownload(S.whisper.download.id); },
  "dl-abort"() {
    const w = S.whisper;
    clearInterval(dlTimer);
    announce(`${byId(w.download.id).name} download canceled`);
    w.download = null;
    if (!w.downloaded[w.selectedId]) w.selectedId = w.activeId;
    S.focusKey = "ws";
    render();
  },
  "dl-dismiss"() {
    const w = S.whisper;
    if (w.download?.failed) w.download = null;
    if (!w.downloaded[w.selectedId] && w.download?.id !== w.selectedId) w.selectedId = w.activeId;
    S.focusKey = "ws";
    render();
  },
  menu(btn) {
    const id = btn.dataset.id;
    if (S.providers.openMenuId === id) closeMenus(true);
    else openMenu(id);
  },
  pick(btn) {
    const p = provider(btn.dataset.id);
    p.model = btn.dataset.model;
    S.providers.openMenuId = null;
    S.focusKey = `select-${p.id}`;
    announce(`${p.name} model: ${p.model}`);
    render();
  },
  refresh(btn) { fetchModels(btn.dataset.id); },
  configure(btn) {
    const P = S.providers;
    const id = btn.dataset.id;
    const previous = P.expandedId && provider(P.expandedId);
    const opening = P.expandedId !== id;
    P.expandedId = opening ? id : null;
    P.openMenuId = null;
    S.focusKey = opening ? firstFieldKey(provider(id)) : `cfg-${id}`;
    if (previous?.dirty) fetchModels(previous.id);
    else render();
  },
  done(btn) {
    const p = provider(btn.dataset.id);
    S.providers.expandedId = null;
    S.focusKey = `cfg-${p.id}`;
    if (p.dirty) fetchModels(p.id);
    else render();
  },
  "provider-toggle"(btn) {
    const P = S.providers;
    const p = provider(btn.dataset.id);
    if (!canActivate(p)) {
      if (p.loading) return;
      P.expandedId = p.id;
      S.focusKey = firstFieldKey(p);
      announce(isConfigured(p) ? `${p.name} needs a working connection first` : `Add connection details to activate ${p.name}`);
      render();
      return;
    }
    const on = P.activeId !== p.id;
    P.activeId = on ? p.id : null;
    announce(`${p.name} ${on ? "active" : "inactive"}`);
    commitSwitches();
  },
  "proto-reset"() {
    clearInterval(dlTimer);
    S.providers.list.forEach(p => clearTimeout(p.timer));
    const collapsed = S.sidebarCollapsed;
    S = initialState();
    S.sidebarCollapsed = collapsed;
    render();
  },
};

addEventListener("pointerdown", () => { document.documentElement.dataset.input = "pointer"; }, true);
addEventListener("keydown", () => { document.documentElement.dataset.input = "keyboard"; }, true);

document.addEventListener("click", e => {
  const label = e.target.closest(".ws-label");
  if (label) return commitWhisper(Number(label.dataset.idx));
  const target = e.target.closest("[data-action]");
  if (!target || !ACTIONS[target.dataset.action]) return;
  e.preventDefault();
  ACTIONS[target.dataset.action](target, e);
});

// Slider drag
function idxFromX(rail, x) {
  const r = $(".ws-inner", rail).getBoundingClientRect();
  return clampIdx(Math.round(((x - r.left) / r.width) * (MODELS.length - 1)));
}
document.addEventListener("pointerdown", e => {
  if (S.providers.openMenuId && !e.target.closest(".select-wrap")) closeMenus(false);
  const rail = e.target.closest(".ws-rail");
  if (!rail || e.button !== 0) return;
  e.preventDefault();
  rail.focus();
  rail.setPointerCapture(e.pointerId);
  drag = { rail, idx: idxFromX(rail, e.clientX) };
  paintSlider(drag.idx);
}, true);
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const i = idxFromX(drag.rail, e.clientX);
  if (i !== drag.idx) paintSlider((drag.idx = i));
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const { idx } = drag;
  drag = null;
  commitWhisper(idx);
});
document.addEventListener("pointercancel", () => {
  if (!drag) return;
  drag = null;
  render();
});

document.addEventListener("keydown", e => {
  const t = e.target;

  if (t.matches(".ws-rail")) {
    const i = idxOf(S.whisper.selectedId);
    const next = { ArrowLeft: i - 1, ArrowDown: i - 1, PageDown: i - 1, ArrowRight: i + 1, ArrowUp: i + 1, PageUp: i + 1, Home: 0, End: MODELS.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    if (clampIdx(next) !== i) commitWhisper(clampIdx(next));
    return;
  }

  const menu = t.closest(".menu");
  if (menu) {
    const items = [...menu.querySelectorAll(".menu-item")];
    const at = items.indexOf(document.activeElement);
    const go = j => items[(j + items.length) % items.length].focus();
    if (e.key === "ArrowDown") { e.preventDefault(); go(at + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); go(at - 1); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(items.length - 1); }
    else if (e.key === "Escape") { e.preventDefault(); closeMenus(true); }
    else if (e.key === "Tab") closeMenus(false);
    return;
  }

  if (t.matches(".select") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    openMenu(t.dataset.id);
    return;
  }

  if (t.matches(".pconfig .input") && e.key === "Enter") {
    e.preventDefault();
    fetchModels(t.dataset.id);
    return;
  }

  if (e.key === "Escape" && t.closest(".pconfig")) {
    const id = S.providers.expandedId;
    ACTIONS.done({ dataset: { id } });
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (!t.matches(".pconfig .input")) return;
  const p = provider(t.dataset.id);
  p[t.dataset.field] = t.value;
  p.dirty = true;
});

document.addEventListener("change", e => {
  const t = e.target;
  const w = S.whisper;
  switch (t.dataset.sim) {
    case "downloaded": {
      const id = t.dataset.id;
      w.downloaded[id] = t.checked;
      if (t.checked) {
        if (w.download?.id === id) { clearInterval(dlTimer); w.download = null; }
        if (w.selectedId === id) w.activeId = id;
      } else {
        // Same fallback as ModelManager: drop back to the bundled Base model.
        if (w.activeId === id) w.activeId = "base";
        if (w.selectedId === id) w.selectedId = w.activeId;
      }
      return render();
    }
    case "fail":
      S.sim.failNextDownload = t.checked;
      return;
    case "key":
      provider("openai").apiKey = t.checked ? MOCK_KEY : "";
      return fetchModels("openai");
    case "local":
      S.sim.localReachable = t.checked;
      return fetchModels("local");
  }
});

window.addEventListener("hashchange", () => {
  S.page = pageFromHash();
  S.providers.openMenuId = null;
  render();
});

new ResizeObserver(updateWinSize).observe(el.window);

render();
</script>
</body>
</html>
