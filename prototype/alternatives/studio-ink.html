<!doctype html>
<html lang="en" data-theme="paper" data-font="bricolage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shh.. · Studio Ink</title>
<!--
  "Ink", after the Silenzio mark: solid black organic shapes on white paper, no accent colour.
  The sidebar is one ink blob; the current page is a white tab that melts into the page, like the gaps
  between the lips in the mark. Rock 3D for the brand, page titles and section titles only (it's an
  outlined display face, unreadable below ~18px); a quiet sans for everything else.
  Same data and behaviour as studio-graphite.html, synced with the app on 2026-10-24
  (no Home pipeline, no sidebar status, mute-while-recording setting, paste-last shortcut).
  The bar above the window switches Paper/Ink and the text font; it isn't part of the app.
  Open directly (`open prototype/alternatives/studio-ink.html`).
  Deep links: #home, #styles, #providers, #speech, #settings, #help.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rock+3D&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Figtree:wght@400..700&family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
:root {
  /* Paper: black ink on white, nothing else */
  --paper: #ffffff;
  --ink: #0d0d0d;
  --text: var(--ink);
  --text-2: #545350;          /* 7.6:1 on --paper */
  --text-3: #6c6b68;          /* 5.3:1, meta only */
  --hair: rgba(13, 13, 13, .09);
  --hover: rgba(13, 13, 13, .04);
  --fill: rgba(13, 13, 13, .06);
  --fill-hover: rgba(13, 13, 13, .1);
  --off: rgba(13, 13, 13, .2);
  --ink-soft: #2e2e2d;        /* primary button hover */
  --shadow: 0 18px 40px rgba(13, 13, 13, .22), 0 3px 10px rgba(13, 13, 13, .12);

  /* Things drawn on the ink blob (sidebar, menus, toasts, keys) */
  --on-ink: #ffffff;
  --on-ink-2: rgba(255, 255, 255, .7);
  --on-ink-3: rgba(255, 255, 255, .45);
  --ink-hover: rgba(255, 255, 255, .11);
  --ink-hair: rgba(255, 255, 255, .14);

  --stage: #dddbd6;
  --stage-text: #3b3a38;

  --display: "Rock 3D", "Rock3D-Regular", ui-rounded, system-ui, sans-serif;
  --sans: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --squish: cubic-bezier(.3, 1.45, .5, 1);   /* overshoots a little, like a drop settling */
}
/* Ink: the negative. Same shapes, light blob on a dark page. */
[data-theme="ink"] {
  --paper: #0f0f0e;
  --ink: #f3f1ec;
  --text-2: #b3b0aa;          /* 8.6:1 on --paper */
  --text-3: #95928c;          /* 6.0:1 */
  --hair: rgba(243, 241, 236, .1);
  --hover: rgba(243, 241, 236, .045);
  --fill: rgba(243, 241, 236, .08);
  --fill-hover: rgba(243, 241, 236, .13);
  --off: rgba(243, 241, 236, .26);
  --ink-soft: #d9d6cf;
  --shadow: 0 18px 40px rgba(0, 0, 0, .55), 0 3px 10px rgba(0, 0, 0, .3);
  --on-ink: #0f0f0e;
  --on-ink-2: rgba(15, 15, 14, .7);
  --on-ink-3: rgba(15, 15, 14, .45);
  --ink-hover: rgba(15, 15, 14, .08);
  --ink-hair: rgba(15, 15, 14, .12);
  --stage: #2a2927;
  --stage-text: #d6d3cd;
}
[data-font="figtree"] { --sans: "Figtree", ui-sans-serif, system-ui, -apple-system, sans-serif; }
[data-font="inter"] { --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--stage);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s;
}
button, input, textarea { font: inherit; color: inherit; }
button { margin: 0; padding: 0; border: 0; background: none; text-align: inherit; cursor: pointer; }
button:disabled { cursor: default; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ───────────── Stage (not part of the app) ───────────── */

.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 28px 24px 48px;
}
.stagebar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; font-size: 12px; color: var(--stage-text); }
.stage-opt { display: flex; align-items: center; gap: 8px; }
.stage-seg { display: flex; padding: 2px; border-radius: 999px; background: color-mix(in srgb, var(--stage-text) 10%, transparent); }
.stage-seg button { padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--stage-text); }
.stage-seg button[aria-pressed="true"] { background: var(--stage-text); color: var(--stage); }
.stage-seg button:focus-visible { outline: 2px solid var(--stage-text); outline-offset: 1px; }

/* ───────────── Window ───────────── */

.window {
  position: relative;
  flex: none;
  width: 800px;
  height: 550px;
  min-width: 700px;
  min-height: 500px;
  resize: both;
  overflow: hidden;
  border-radius: 12px;
  background: var(--paper);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .14), 0 28px 70px rgba(0, 0, 0, .22), 0 6px 18px rgba(0, 0, 0, .1);
}

.app {
  position: absolute;
  inset: 0;
  display: flex;
  background: var(--paper);
  color: var(--text);
  color-scheme: light;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  transition: background-color .2s, color .2s;
}
[data-theme="ink"] .app { color-scheme: dark; }
[data-font="inter"] .app { font-feature-settings: "cv05", "cv08"; }
.app ::selection { background: var(--ink); color: var(--paper); }
.app :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.side :focus-visible, .menu :focus-visible, .toast :focus-visible { outline-color: var(--on-ink); }
[data-input="pointer"] .app :focus-visible { outline: none; }
.i { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }

/* Rock 3D is drawn in hairline outlines; a stroke gives it the weight of the ink shapes. Its space is very wide. */
.head h1, .brand-word, .day, .group-title, .engine-name, .empty-title {
  -webkit-text-stroke: var(--display-stroke, .6px) currentColor;
  word-spacing: -.32em;
}
.head h1 { --display-stroke: 1.1px; }
.brand-word { --display-stroke: .8px; }

/* ───────────── Sidebar: one ink blob ───────────── */

.side {
  position: relative;
  z-index: 1;
  flex: none;
  width: 196px;
  display: flex;
  flex-direction: column;
  padding: 18px 0 48px 12px;   /* room under the last tab for its lower corner before the blob curves away */
  border-radius: 0 28px 28px 0;
  background: var(--ink);
  color: var(--on-ink);
}
.lights { display: flex; gap: 8px; padding-left: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }

.brand {
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 26px 0 0 8px;
  border-radius: 8px;
  color: var(--on-ink);
  text-decoration: none;
}
.brand-mark { width: 34px; height: 39px; fill: currentColor; overflow: visible; }
.brand-word { font: 400 25px/1 var(--display); letter-spacing: .02em; }
.brand-mark .drop { transform-box: fill-box; transform-origin: center; }
.brand:hover .drop { animation: spray .6s var(--squish) both; }
.brand:hover .drop:nth-of-type(3) { animation-delay: .05s; }
.brand:hover .drop:nth-of-type(4) { animation-delay: .1s; }
@keyframes spray {
  35% { transform: translate(calc(var(--dx) * 60px), calc(var(--dy) * 60px)) scale(1.25); }
  100% { transform: none; }
}

.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-top { margin-top: 24px; }
.nav-gap { height: 18px; }
.nav-bottom { margin-top: auto; }
.nav-row {
  position: relative;
  z-index: 1;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 11px;
  margin-right: 12px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--on-ink-2);
  text-decoration: none;
  white-space: nowrap;
  transition: background-color .15s, color .2s;
}
.nav-row:hover { background: var(--ink-hover); color: var(--on-ink); }
.nav-row[aria-current="page"] { background: none; color: var(--ink); font-weight: 600; }
.nav-row[aria-current="page"]:focus-visible { outline-color: var(--ink); outline-offset: -4px; }

/* The current page: a paper tab that reaches out of the page into the blob, with concave corners */
.tab {
  position: absolute;
  left: 12px;
  right: 0;
  top: 0;
  height: 36px;
  border-radius: 18px 0 0 18px;
  background: var(--paper);
  transform-origin: 100% 50%;
  transition: top .45s var(--squish), height .2s, background-color .2s;
  pointer-events: none;
}
.tab::before, .tab::after {
  content: "";
  position: absolute;
  right: 0;
  width: 18px;
  height: 18px;
}
.tab::before { bottom: 100%; background: radial-gradient(circle at 0 0, transparent 17.5px, var(--paper) 18px); }
.tab::after { top: 100%; background: radial-gradient(circle at 0 100%, transparent 17.5px, var(--paper) 18px); }
.tab.no-anim { transition: none; }

/* ───────────── Page frame ───────────── */

.content { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.head {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "title title" "sub actions";
  align-items: start;
  column-gap: 28px;
  margin: 36px 44px 0;
}
.head h1 {
  grid-area: title;
  margin: 0;
  font: 400 40px/1.05 var(--display);
  letter-spacing: .01em;
  white-space: nowrap;
}
.head-actions { grid-area: actions; display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.sub { grid-area: sub; margin: 12px 0 0; max-width: 54ch; color: var(--text-2); line-height: 21px; }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 30px 44px 72px; }
.inner { max-width: 680px; }

/* ───────────── Shared controls ───────────── */

kbd, .kbd {
  display: inline-block;
  min-width: 22px;
  padding: 0 6px;
  border-radius: 7px;
  background: var(--ink);
  font: 600 11.5px/21px var(--mono);
  color: var(--on-ink);
  text-align: center;
  vertical-align: 1px;
}
.kbd-hint { font-size: 12px; line-height: 1; color: var(--text-3); }

.btn {
  height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 15px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: background-color .15s, color .15s, transform .15s var(--squish);
}
.btn:active:not(:disabled) { transform: scale(.96); }
.btn .kbd-hint { margin-left: 4px; }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover:not(:disabled) { background: var(--ink-soft); }
.btn-primary:disabled { background: var(--fill); color: var(--text-3); }
.btn-ghost { background: var(--fill); color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--fill-hover); }
.btn-ghost:disabled { color: var(--text-3); }
.btn-plain { padding: 0 12px; color: var(--text-2); }
.btn-plain:hover { background: var(--fill); color: var(--text); }

.icon-btn {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--text-2);
  transition: background-color .15s, color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--fill-hover); color: var(--text); }
.icon-btn:disabled { opacity: .4; }

/* Always-visible row menu: actions never depend on hover */
.more { color: var(--text-3); }
.more[aria-expanded="true"] { background: var(--ink); color: var(--on-ink); }
.more-slot { display: block; width: 30px; height: 30px; }
.more-wrap { position: relative; flex: none; }

.link {
  border-radius: 3px;
  color: var(--text);
  font-weight: 500;
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
  text-decoration-color: var(--off);
  transition: text-decoration-color .15s;
}
.link:hover { text-decoration-color: var(--ink); }

/* The knob stretches like a drop: the leading edge moves first, the trailing edge catches up */
.switch {
  position: relative;
  flex: none;
  width: 40px;
  height: 24px;
  border-radius: 12px;
  background: var(--off);
  transition: background-color .2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  right: 19px;
  border-radius: 9px;
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
  transition: left .2s var(--ease), right .22s var(--ease) .07s;
}
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { left: 19px; right: 3px; transition: right .2s var(--ease), left .22s var(--ease) .07s; }

.radio {
  position: relative;
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px var(--off);
}
.radio::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, var(--paper) 2.6px, var(--ink) 3.2px);
  transform: scale(0);
  transition: transform .3s var(--squish);
}
.radio.is-on::after { transform: scale(1); }

.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--text); }
.field-label .opt { font-weight: 400; color: var(--text-3); }
.input {
  width: 100%;
  height: 38px;
  padding: 0 15px;
  border: 0;
  border-radius: 999px;
  background: var(--fill);
  font-size: 13.5px;
  color: var(--text);
  outline: none;
  transition: background-color .15s, box-shadow .15s;
}
textarea.input { height: auto; min-height: 104px; padding: 11px 15px; border-radius: 18px; line-height: 1.55; resize: vertical; display: block; }
.input::placeholder { color: var(--text-3); }
.input:hover { background: var(--fill-hover); }
.input:focus { background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); }
.app .input:focus-visible, .app .search input:focus-visible { outline: none; }   /* the ink ring above is the focus indicator */

/* Three drops, from the mark. Used as the loading indicator and the "Copied" splash. */
.drops { flex: none; display: block; height: 13px; width: 9px; fill: currentColor; overflow: visible; }
.drops path { transform-box: fill-box; transform-origin: center; }
.drops.is-loading path { animation: drip 1s ease-in-out infinite; }
.drops.is-loading path:nth-child(2) { animation-delay: .15s; }
.drops.is-loading path:nth-child(3) { animation-delay: .3s; }
@keyframes drip { 0%, 100% { opacity: .2; transform: scale(.7); } 40% { opacity: 1; transform: none; } }
.drops.is-splash path { animation: splash .45s var(--squish) both; }
.drops.is-splash path:nth-child(2) { animation-delay: .05s; }
.drops.is-splash path:nth-child(3) { animation-delay: .1s; }
@keyframes splash { from { opacity: 0; transform: translate(calc(var(--dx) * -70px), calc(var(--dy) * -70px)) scale(.2); } }

.dot-state { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--text); }
.dot-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Floating layer: an ink blob, the only raised surface */
.menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 30;
  min-width: 100%;
  max-height: 260px;
  overflow-y: auto;
  padding: 6px;
  border-radius: 20px;
  background: var(--ink);
  color: var(--on-ink);
  box-shadow: var(--shadow);
  transform-origin: top right;
  animation: blob-in .22s var(--squish);
}
.menu.is-up { top: auto; bottom: calc(100% + 8px); transform-origin: bottom right; }
@keyframes blob-in { from { opacity: 0; transform: scale(.85, .7); border-radius: 40px; } }
.menu-row { min-width: 200px; }
.menu-item {
  width: 100%;
  height: 32px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px 0 11px;
  border-radius: 999px;
  font-size: 13.5px;
  white-space: nowrap;
  color: var(--on-ink);
}
.menu-item:hover:not(:disabled), .menu-item:focus { background: var(--ink-hover); outline: none; }
.menu-item:disabled { color: var(--on-ink-3); }
.menu-item .check { color: var(--on-ink); visibility: hidden; }
.menu-item[aria-checked="true"] { font-weight: 600; }
.menu-item[aria-checked="true"] .check { visibility: visible; }
.menu-row .menu-item .i { color: var(--on-ink-2); }
.menu-item.is-danger, .menu-row .menu-item.is-danger .i { color: var(--on-ink); }
.menu-foot { color: var(--on-ink-2); }
.menu-sep { height: 1px; margin: 5px 10px; background: var(--ink-hair); }

.picker-wrap { position: relative; flex: none; }
.picker {
  height: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 11px 0 14px;
  border-radius: 999px;
  background: var(--fill);
  font-size: 13.5px;
  font-weight: 500;
  transition: background-color .15s;
}
.picker:hover { background: var(--fill-hover); }
.picker[aria-expanded="true"] { background: var(--ink); color: var(--on-ink); }
.picker-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.picker > .i { color: currentColor; opacity: .6; }

/* ───────────── Lists ───────────── */

.list { margin: 0 -14px; }
.item { position: relative; min-height: 40px; padding: 16px 14px; border-radius: 20px; transition: background-color .15s; }
.item + .item::before {
  content: "";
  position: absolute;
  top: 0;
  left: 14px;
  right: 14px;
  height: 1px;
  background: var(--hair);
  transition: opacity .15s;
}
.item.is-hoverable:hover { background: var(--hover); }
.item.is-hoverable:hover::before,
.item.is-hoverable:hover + .item::before { opacity: 0; }

.confirm {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  color: var(--text);
}
.confirm-text { margin-right: auto; font-weight: 500; }

.empty { display: flex; flex-direction: column; align-items: center; padding: 44px 0 24px; text-align: center; color: var(--text-2); }
.empty-mark { width: 92px; height: 105px; margin-bottom: 20px; fill: var(--ink); }
.empty-title { margin-bottom: 6px; font: 400 21px/1.2 var(--display); color: var(--text); }

/* ───────────── Home ───────────── */

.search {
  width: 220px;
  height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 7px 0 13px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--text-3);
  cursor: text;
  transition: background-color .15s, box-shadow .15s;
}
.search:hover { background: var(--fill-hover); }
.search:focus-within { background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); color: var(--text); }
.search input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; outline: none; font-size: 13.5px; color: var(--text); }
.search input::placeholder { color: var(--text-3); }
.search .kbd-hint { padding-right: 6px; }
.search-clear { display: none; width: 22px; height: 22px; place-items: center; border-radius: 50%; background: var(--ink); color: var(--on-ink); }
.search:has(input:not(:placeholder-shown)) .kbd-hint { display: none; }
.search:has(input:not(:placeholder-shown)) .search-clear { display: grid; }

.day { margin: 40px 0 8px; font: 400 21px/1.2 var(--display); letter-spacing: .01em; color: var(--text); }
.day:first-child { margin-top: 2px; }

.entry { display: flex; align-items: flex-start; gap: 20px; }
.entry-main { flex: 1; min-width: 0; }
.entry-text {
  display: block;
  width: 100%;
  max-width: 64ch;
  border-radius: 4px;
  font-size: 15px;
  line-height: 23px;
  white-space: pre-line;
  color: var(--text);
}
.entry-text > span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.entry.is-original .entry-text { color: var(--text-2); }
.entry-text mark { padding: 0 2px; margin: 0 -2px; border-radius: 4px; background: var(--ink); color: var(--paper); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.entry-meta { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-3); }
.entry-meta .link { font-weight: 400; color: var(--text-2); }
.entry-side { flex: none; height: 23px; display: flex; align-items: center; gap: 4px; }
.entry-side .more { margin-right: -6px; }
.entry-time { min-width: 40px; text-align: right; font-size: 12.5px; color: var(--text-3); }
.copied { min-width: 40px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.copied .drops { width: 11px; height: 16px; }

.toast-host {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 22px;
  z-index: 35;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 6px 6px 18px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--on-ink);
  font-weight: 500;
  box-shadow: var(--shadow);
  pointer-events: auto;
  animation: toast-in .3s var(--squish);
}
.toast.is-plain { padding: 9px 18px; }
.toast b { font-weight: 700; }
.toast .btn-plain { background: var(--paper); color: var(--ink); }
.toast .btn-plain:hover { background: var(--paper); opacity: .9; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(.9, .8); } }

/* ───────────── Styles ───────────── */

.style-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: start; }
.style-row .more-wrap { margin: -4px -6px 0 0; }
.style-row .confirm { grid-column: 1 / -1; margin-left: 32px; }
.pick { width: 100%; display: flex; align-items: flex-start; gap: 14px; border-radius: 8px; }
.pick .radio { margin-top: 2px; }
.pick-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pick-name { font-size: 15px; font-weight: 600; line-height: 22px; color: var(--text); }
.pick-desc {
  max-width: 60ch;
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.editor { display: flex; flex-direction: column; gap: 16px; padding: 18px 14px 20px 46px; }
.editor-foot { display: flex; align-items: center; gap: 6px; }
.editor-foot .kbd-hint { margin-right: auto; }

/* ───────────── Providers ───────────── */

.prov-row { display: flex; align-items: center; gap: 14px; }
.prov-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.prov-main .disclosure { margin-left: -6px; }
.prov-text { min-width: 0; }
.prov-name { font-size: 15px; font-weight: 600; line-height: 22px; }
.prov-meta { margin-top: 1px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prov .picker { width: 184px; }
.disclosure { width: 26px; height: 26px; color: var(--text-3); }
.disclosure .i { transition: transform .25s var(--squish); }
.disclosure[aria-expanded="true"] .i { transform: rotate(90deg); }
.conn { padding: 20px 0 6px 30px; }
.conn-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.conn-fields.is-one { grid-template-columns: minmax(0, 360px); }
.conn-foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.conn-status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.conn-foot .btn-plain { margin-left: auto; margin-right: -12px; }

/* ───────────── Speech models ───────────── */

.switch-label { font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer; }
.off-note { display: flex; align-items: center; gap: 10px; margin: 0 0 24px; font-weight: 500; color: var(--text); }
.off-note::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); }
.engines { margin: 0 -14px; container-type: inline-size; transition: opacity .2s; }
.engines.is-off { opacity: .4; pointer-events: none; }
.engine { position: relative; padding: 6px 0; }
.engine + .engine { margin-top: 10px; }
.engine + .engine::before {
  content: "";
  position: absolute;
  top: 0;
  left: 14px;
  right: 14px;
  height: 1px;
  background: var(--hair);
}
.engine-head {
  width: 100%;
  height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-radius: 999px;
  transition: background-color .15s;
}
.engine-head:hover { background: var(--hover); }
.engine-chev { flex: none; width: 18px; display: grid; place-items: center; color: var(--text-3); }
.engine-chev .i { transition: transform .25s var(--squish); }
.engine-head[aria-expanded="true"] .engine-chev .i { transform: rotate(90deg); }
.engine-name { flex: none; font: 400 21px/1 var(--display); letter-spacing: .01em; }
.engine-meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text-3); }
.engine-side { flex: none; margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--text-3); }

.mrow {
  position: relative;
  display: grid;
  grid-template-columns: 18px 76px minmax(0, 1fr) 62px 96px 30px;
  column-gap: 12px;
  align-items: center;
  min-height: 42px;
  padding: 0 14px;
  border-radius: 21px;
  cursor: pointer;
  transition: background-color .15s;
}
.mrow:hover { background: var(--hover); }
.radio-btn { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; }
.m-name { font-size: 14px; font-weight: 600; white-space: nowrap; }
.m-desc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.m-size { text-align: right; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.m-status { display: flex; justify-content: flex-end; font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
.m-act { display: flex; justify-content: flex-end; }
.get {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-right: -6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--fill);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  transition: background-color .15s, color .15s;
}
.get:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.get:disabled { opacity: .45; }
.m-track {
  position: absolute;
  left: 44px;
  right: 14px;
  bottom: 2px;
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  background: var(--fill);
}
.m-track > span { display: block; height: 100%; border-radius: 2px; background: var(--ink); transition: width .1s linear; }
.m-extra { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; padding: 2px 0 12px; cursor: default; }
.m-extra-text { margin-right: auto; color: var(--text-2); }
.m-extra-text b { font-weight: 600; color: var(--text); }

@container (max-width: 470px) {
  .mrow { grid-template-columns: 18px minmax(0, 1fr) 62px 96px 30px; }
  .m-desc { display: none; }
}

/* ───────────── Settings + Help ───────────── */

.group + .group { margin-top: 44px; }
.group-title { margin: 0 0 6px; font: 400 21px/1.2 var(--display); letter-spacing: .01em; color: var(--text); }
.setting { position: relative; display: flex; align-items: center; gap: 24px; padding: 16px 0; }
.setting + .setting::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--hair); }
.setting-text { flex: 1; min-width: 0; }
.setting-label { font-size: 15px; font-weight: 500; line-height: 22px; }
.setting-desc { margin-top: 2px; color: var(--text-2); }
.setting-desc.is-warn { color: var(--text); font-weight: 500; }
.setting-control { flex: none; display: flex; align-items: center; gap: 6px; }
.lang .picker { width: 168px; }

.step { align-items: flex-start; gap: 16px; }
.step-num {
  flex: none;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--ink);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--on-ink);
  font-variant-numeric: tabular-nums;
}
.step .link { flex: none; font-size: 13px; line-height: 22px; }
.keys { flex: none; display: flex; gap: 4px; align-items: center; }
.keys .kbd-note { margin-right: 4px; font-size: 12.5px; color: var(--text-3); }
.about { margin: 10px 0 0; max-width: 60ch; color: var(--text-2); }
.version { margin: 8px 0 0; font-size: 12.5px; color: var(--text-3); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation-duration: 0s !important; animation-delay: 0s !important; }
}
</style>
</head>
<body>
<main class="stage">
  <div class="stagebar" aria-label="Prototype options">

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtBytes = b => (b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${Math.round(b / 1e6)} MB`);
const model = id => MODELS.find(m => m.id === id);
const fullName = id => `${model(id).engine.name} ${model(id).name}`;
const provider = id => S.providers.find(p => p.id === id);
const activeStyle = () => S.styles.find(s => s.id === S.activeStyle) || null;

const host = url => url.replace(/^https?:\/\//, "").replace(/\/+$/, "");

const MARK_DROPS = [
  "M713 289 726 290 737 298 743 312 742 325 735 339 713 367 680 408 676 412 672 412 669 409 669 404 677 342 681 324 687 309 694 299 702 292Z",
  "M793 365 801 364 810 366 819 371 825 379 828 388 827 398 824 406 817 414 806 421 787 427 708 445 702 445 698 444 697 440 699 436 746 395 773 374Z",

// Each drop flies along the line from beside the fingertip through its middle (--dx, --dy).
const SPRAY_ORIGIN = [660, 480];
const dropStyle = d => {
  const xy = d.slice(1, -1).trim().split(/\s+/).map(Number);
  const n = xy.length / 2;
  const cx = xy.filter((_, i) => i % 2 === 0).reduce((a, b) => a + b, 0) / n - SPRAY_ORIGIN[0];
  const cy = xy.filter((_, i) => i % 2 === 1).reduce((a, b) => a + b, 0) / n - SPRAY_ORIGIN[1];
  const len = Math.hypot(cx, cy) || 1;
  return `--dx:${(cx / len).toFixed(3)};--dy:${(cy / len).toFixed(3)}`;
};

function markSVG(cls) {
  return `<svg class="${cls}" viewBox="0 0 1001 1142" aria-hidden="true" focusable="false"><path d="${MARK_BODY}"/>${MARK_DROPS.map(d => `<path class="drop" style="${dropStyle(d)}" d="${d}"/>`).join("")}</svg>`;
}

function dropsSVG(cls = "") {
  return `<svg class="drops ${cls}" viewBox="664 284 170 245" aria-hidden="true" focusable="false">${MARK_DROPS.map(d => `<path style="${dropStyle(d)}" d="${d}"/>`).join("")}</svg>`;
}

// Built once so the tab can slide between pages; later renders only move it.
function renderRail() {
  if (!el.rail.firstChild) {
    const row = ([id, label, ic]) => `
      <a class="nav-row" href="#${id}" data-page="${id}" data-key="nav-${id}">
        ${icon(ic, 17, 2)}<span>${label}</span>
      </a>`;
    el.rail.innerHTML = `
      <div class="tab no-anim" aria-hidden="true"></div>
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <a class="brand" href="#home" data-key="brand" aria-label="Shh.. home">${markSVG("brand-mark")}<span class="brand-word" aria-hidden="true">Shh..</span></a>
      <div class="nav nav-top">${NAV.groups.map(g => g.map(row).join("")).join('<div class="nav-gap" aria-hidden="true"></div>')}</div>
      <div class="nav nav-bottom">${NAV.bottom.map(row).join("")}</div>`;
    new ResizeObserver(() => moveTab(false)).observe(el.rail);
  }
  el.rail.querySelectorAll(".nav-row").forEach(a => {
    if (a.dataset.page === S.page) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  moveTab(true);
}

// The tab shortens as it travels, like a drop pulled along the edge, then settles with a little overshoot.
function moveTab(animate) {
  const tab = $(".tab", el.rail);
  const row = $('.nav-row[aria-current="page"]', el.rail);
  if (!tab || !row) return;
  const top = row.getBoundingClientRect().top - el.rail.getBoundingClientRect().top;
  const from = parseFloat(tab.style.top);
  const moving = animate && !Number.isNaN(from) && Math.abs(from - top) > 1 && !reducedMotion();
  tab.classList.toggle("no-anim", !moving);
  tab.style.top = `${top}px`;
  tab.style.height = `${row.offsetHeight}px`;
  if (moving) {
    tab.animate([
      { transform: "none" },
      { transform: "scaleX(.72) scaleY(.82)", offset: .35 },
      { transform: "none" },
    ], { duration: 450, easing: "ease-in-out" });
  }
}

function homeBody() {
  return `<div id="history">${historyHTML()}</div>`;
}

function matches(e, q) {
  return e.text.toLowerCase().includes(q) || (e.raw || "").toLowerCase().includes(q);
}

function highlight(text) {
  const q = S.search.trim().toLowerCase();
  if (!q) return esc(text);
  let out = "", at = 0;
  const lower = text.toLowerCase();
  for (let i = lower.indexOf(q); i !== -1; i = lower.indexOf(q, at)) {
    out += esc(text.slice(at, i)) + `<mark>${esc(text.slice(i, i + q.length))}</mark>`;
    at = i + q.length;
  }
  return out + esc(text.slice(at));
}

function historyHTML() {
  const q = S.search.trim().toLowerCase();
  if (!S.entries.length) {
    return `
      <div class="empty">
        ${markSVG("empty-mark")}
        <div class="empty-title">No dictations yet</div>
        <div>Hold fn anywhere on your Mac. What you say shows up here.</div>
      </div>`;
  }
  const list = S.entries.filter(e => !q || matches(e, q));
  if (!list.length) {
    return `
      <div class="empty">
        <div class="empty-title">Nothing matches “${esc(S.search.trim())}”</div>
        <button class="link" data-action="clear-search" data-key="clear-search-empty">Clear search</button>
      </div>`;
  }
  const days = [];
  list.forEach(e => {
    const last = days[days.length - 1];
    if (last && last.day === e.day) last.items.push(e);
    else days.push({ day: e.day, items: [e] });
  });
  return days.map(d => `
    <h2 class="day">${d.day}</h2>
    <div class="list">${d.items.map(entryHTML).join("")}</div>`).join("");
}

function entryHTML(e) {
  const showRaw = !!(e.raw && S.showRaw[e.id]);
  const copied = S.copiedId === e.id;
  const meta = e.style ? `
    <div class="entry-meta">
      <span>${showRaw ? "Original transcript" : `Rewritten with ${esc(e.style)}`}</span>
      <span aria-hidden="true">·</span>
      <button class="link" data-action="toggle-raw" data-id="${e.id}" data-key="raw-${e.id}">${showRaw ? `Show ${esc(e.style)} version` : "Show original"}</button>
    </div>` : "";
  const menuId = `row:entry:${e.id}`;
  const items = [{ label: "Copy", icon: "copy", action: "copy", id: e.id, key: `copy-${e.id}` }];
  if (e.raw) items.push({ label: showRaw ? `Show ${esc(e.style)} version` : "Show original", icon: "swap", action: "toggle-raw", id: e.id, key: `menu-raw-${e.id}` });
  items.push("-", { label: "Delete", icon: "trash", action: "delete-entry", id: e.id, key: `del-${e.id}`, danger: true });
  return `
    <div class="item is-hoverable entry${showRaw ? " is-original" : ""}${copied ? " is-copied" : ""}" data-row-menu="${menuId}">
      <div class="entry-main">
        <button class="entry-text" data-action="copy" data-id="${e.id}" data-key="text-${e.id}" title="Click to copy"><span>${highlight(showRaw ? e.raw : e.text)}</span></button>
        ${meta}
      </div>
      <div class="entry-side">
        ${copied ? `<span class="copied" role="status">${dropsSVG("is-splash")}Copied</span>` : `<span class="entry-time num">${e.time}</span>`}
        ${moreMenu(menuId, `dictation from ${e.time}`, items)}
      </div>
    </div>`;
}

function refreshHistory() {
  const box = $("#history");
  if (!box) return;
  const key = document.activeElement?.dataset?.key;
  box.innerHTML = historyHTML();
  if (key && box.querySelector(`[data-key="${CSS.escape(key)}"]`)) box.querySelector(`[data-key="${CSS.escape(key)}"]`).focus({ preventScroll: true });
}

function editorHTML() {
  const d = S.styleEdit;

        <button class="btn btn-plain" data-action="cancel-edit" data-key="cancel-edit">Cancel</button>
        <button class="btn btn-primary" data-action="save-style" data-key="save-style"${d.name.trim() ? "" : " disabled"}>${isNew ? "Create style" : "Save"}</button>
      </div>

}

function saveStyle() {
  const d = S.styleEdit;
  if (!d || !d.name.trim()) return;
  if (d.id === "new") {
    const id = `s${Date.now()}`;
    S.styles.unshift({ id, name: d.name.trim(), prompt: d.prompt.trim() });
    S.focusKey = `style-${id}`;
    announce(`Created ${d.name.trim()}`);
  } else {
    Object.assign(S.styles.find(s => s.id === d.id), { name: d.name.trim(), prompt: d.prompt.trim() });
    S.focusKey = `style-${d.id}`;
  }
  S.styleEdit = null;
  render();
}

    </div>`;
}

function engineHTML(e, tabStop) {
  const sp = S.speech;
  const open = sp.open[e.id];
  const onDisk = e.models.filter(m => sp.downloaded[m.id]).reduce((sum, m) => sum + m.bytes, 0);
  const inUse = e.models.find(m => m.id === sp.inUse);
  return `
    <section class="engine">
      <button class="engine-head" data-action="toggle-engine" data-id="${e.id}" data-key="engine-${e.id}"
        aria-expanded="${open}" aria-controls="models-${e.id}">
        <span class="engine-chev">${icon("right", 14, 2.25)}</span>
        <span class="engine-name">${e.name}</span>
        <span class="engine-meta" title="${esc(e.meta)}">${e.meta}</span>
        <span class="engine-side">
          ${inUse && !open ? `<span class="dot-state">${inUse.name} in use</span>` : ""}
          <span>${onDisk ? `<span class="mono num">${fmtBytes(onDisk)}</span> on disk` : "Not downloaded"}</span>
        </span>
      </button>
      ${open ? `<div id="models-${e.id}">${e.models.map(m => modelRow(m, tabStop)).join("")}</div>` : ""}
    </section>`;
}

function modelRow(m, tabStop) {
  const sp = S.speech;
  const sel = sp.selected === m.id;
  const ready = !!sp.downloaded[m.id];
  const d = sp.download && sp.download.id === m.id ? sp.download : null;
  const pct = d ? Math.round(d.progress * 100) : 0;

  const offering = sel && !ready && !d;
  const busy = !!sp.download;

  let status = "";
  let statusText = "not downloaded";
  if (d) { status = `<span class="num" id="dl-pct">${pct}%</span>`; statusText = "downloading"; }
  else if (sp.inUse === m.id) { status = '<span class="dot-state">In use</span>'; statusText = "in use"; }
  else if (ready) { status = m.bundled ? "Built in" : "On disk"; statusText = m.bundled ? "built in" : "on disk"; }
  else if (!offering) {   // the offer below already has a Download button
    status = `<button class="get" data-action="dl" data-id="${m.id}" data-key="dl-${m.id}"${busy ? " disabled" : ""}
      aria-label="Download ${fullName(m.id)}, ${fmtBytes(m.bytes)}" title="${busy ? "One download at a time" : `Download ${fmtBytes(m.bytes)}`}">${icon("download", 13)}Download</button>`;
  }

  let act = "";
  if (d) {
    act = `<button class="icon-btn" data-action="dl-cancel" data-key="dl-cancel" aria-label="Cancel download" title="Cancel download">${icon("x", 14)}</button>`;
  } else {
    const menuId = `row:model:${m.id}`;
    const items = [];
    if (!ready) {
      items.push(
        { label: "Download and use", icon: "download", action: "dl-use", id: m.id, key: `menu-dluse-${m.id}`, disabled: busy },
        { label: `Download only · ${fmtBytes(m.bytes)}`, icon: "download", action: "dl", id: m.id, key: `menu-dl-${m.id}`, disabled: busy });
    } else {
      if (sp.inUse !== m.id) items.push({ label: "Use", icon: "use", action: "pick-model", id: m.id, key: `menu-use-${m.id}` });
      if (!m.bundled) {
        if (items.length) items.push("-");
        items.push({ label: "Delete from this Mac…", icon: "trash", action: "ask-delete-model", id: m.id, key: `del-${m.id}`, danger: true });
      }
    }
    act = moreMenu(menuId, fullName(m.id), items);
  }

  const desc = d
    ? `Downloading · <span class="num" id="dl-text">${fmtBytes(m.bytes * d.progress)}</span>`
    : m.desc;

  let extra = "";
  if (sp.confirmDelete === m.id) {
    const switching = sp.inUse === m.id;
    extra = `
      <span class="m-extra-text">${switching
        ? `<b>${m.name}</b> is in use. Delete it and switch to ${fullName(FALLBACK_MODEL)}? Frees ${fmtBytes(m.bytes)}.`
        : `Delete <b>${m.name}</b> from this Mac? Frees ${fmtBytes(m.bytes)}.`}</span>
      <button class="btn btn-plain" data-action="cancel-delete-model" data-key="cancel-del-model">Cancel</button>
      <button class="btn btn-primary" data-action="delete-model" data-id="${m.id}" data-key="confirm-del-model">Delete</button>`;
  } else if (offering) {
    extra = `
      <span class="m-extra-text">${fullName(sp.inUse)} stays in use until <b>${m.name}</b> is downloaded.</span>
      <button class="btn btn-plain" data-action="dl-dismiss" data-key="dl-dismiss">Not now</button>
      <button class="btn btn-primary" data-action="dl-use" data-id="${m.id}" data-key="dl-start">Download ${fmtBytes(m.bytes)}</button>`;
  }

  return `
    <div class="mrow" data-action="pick-model" data-id="${m.id}"${d ? "" : ` data-row-menu="row:model:${m.id}"`}>
      <button class="radio-btn" role="radio" aria-checked="${sel}" tabindex="${m.id === tabStop ? 0 : -1}" data-action="pick-model" data-id="${m.id}" data-key="model-${m.id}"
        aria-label="${fullName(m.id)}, ${fmtBytes(m.bytes)}, ${statusText}"><span class="radio${sel ? " is-on" : ""}" aria-hidden="true"></span></button>
      <span class="m-name">${m.name}</span>
      <span class="m-desc"${d ? "" : ` title="${esc(m.desc)}"`}>${desc}</span>
      <span class="m-size mono num">${fmtBytes(m.bytes)}</span>
      <span class="m-status">${status}</span>
      <span class="m-act">${act}</span>
      ${d ? `<span class="m-track" role="progressbar" aria-label="${fullName(m.id)} download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" id="dl-prog"><span id="dl-bar" style="width:${d.progress * 100}%"></span></span>` : ""}
      ${extra ? `<div class="m-extra" data-action="noop">${extra}</div>` : ""}
    </div>`;
}

// `use` switches to the model once it's on disk (picking it); the row's download button only downloads.
function startDownload(id, use) {
  const sp = S.speech;
  const m = model(id);
  clearInterval(dlTimer);
  if (use) sp.selected = id;
  sp.confirmDelete = null;
  sp.download = { id, progress: 0, use };
  const step = 100 / (1500 + (m.bytes / 1e9) * 1500);
  dlTimer = setInterval(() => {
    const d = sp.download;
    if (!d || d.id !== id) return clearInterval(dlTimer);
    d.progress = Math.min(1, d.progress + step);
    if (d.progress >= 1) {
      clearInterval(dlTimer);
      sp.download = null;
      sp.downloaded[id] = true;
      if (d.use && sp.selected === id) sp.inUse = id;
      announce(`${fullName(id)} downloaded${sp.inUse === id ? ", now in use" : ""}`);
      render();
    } else {
      paintProgress(d, m);
    }
  }, 100);
  announce(`Downloading ${fullName(id)}`);
  S.focusKey = "dl-cancel";
  render();
}

function paintProgress(d, m) {
  const bar = $("#dl-bar");
  if (!bar) return;
  const pct = Math.round(d.progress * 100);
  bar.style.width = `${d.progress * 100}%`;
  $("#dl-prog").setAttribute("aria-valuenow", pct);
  $("#dl-text").textContent = fmtBytes(m.bytes * d.progress);
  $("#dl-pct").textContent = `${pct}%`;
}

// ───────────── Menus ─────────────

function openMenu(id) {
  S.menu = id;
  if (id.startsWith("row:")) {
    render();
    $(".menu-row .menu-item:not(:disabled)")?.focus();
    return;
  }
  const items = id === "lang" ? LANGS.map(([k]) => k) : provider(id.slice(6)).models;
  const current = id === "lang" ? S.settings.language : provider(id.slice(6)).model;
  const i = Math.max(0, items.indexOf(current));
  S.focusKey = id === "lang" ? `lang-${i}` : `opt-${id.slice(6)}-${i}`;
  render();
}

// Closes without a re-render so a click that started on another control still lands.
function closeMenus(refocus) {
  const id = S.menu;
  if (!id) return;
  S.menu = null;
  document.querySelectorAll(".menu").forEach(m => m.remove());
  document.querySelectorAll('[aria-haspopup="menu"][aria-expanded="true"]').forEach(b => b.setAttribute("aria-expanded", "false"));
  if (refocus) $(`[data-menu="${id}"]`)?.focus();
}

function placeMenus() {
  const scroller = $("#scroll");
  if (!scroller) return;
  document.querySelectorAll(".menu").forEach(menu => {
    if (menu.getBoundingClientRect().bottom > scroller.getBoundingClientRect().bottom - 8) menu.classList.add("is-up");
  });
}

// ───────────── Actions ─────────────

const ACTIONS = {
  noop() {},
  "clear-search"() {
    S.search = "";
    const input = $("#search");
    if (input) input.value = "";
    refreshHistory();
    input?.focus();
  },
  copy(btn) {
    const e = S.entries.find(x => x.id === btn.dataset.id);
    const text = e.raw && S.showRaw[e.id] ? e.raw : e.text;
    navigator.clipboard?.writeText(text).catch(() => {});
    S.copiedId = e.id;
    announce("Copied to clipboard");
    refreshHistory();
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { S.copiedId = null; refreshHistory(); }, 1400);
  },
  "toggle-raw"(btn) {
    const id = btn.dataset.id;
    S.showRaw[id] = !S.showRaw[id];
    refreshHistory();
  },
  "delete-entry"(btn) {
    const index = S.entries.findIndex(x => x.id === btn.dataset.id);
    const [entry] = S.entries.splice(index, 1);
    S.undo = { entry, index };
    S.notice = null;
    announce("Dictation deleted");
    refreshHistory();
    renderToast();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.undo = null; renderToast(); }, 5000);
  },
  undo() {
    if (!S.undo) return;
    S.entries.splice(S.undo.index, 0, S.undo.entry);
    S.undo = null;
    clearTimeout(toastTimer);
    announce("Dictation restored");
    render();
  },

  "pick-style"(btn) {
    const id = btn.dataset.id || null;
    S.activeStyle = id;
    S.styleConfirm = null;
    S.focusKey = `style-${id || "none"}`;
    announce(id ? `${activeStyle().name} is active` : "No style");
    render();
  },
  "new-style"() {
    // Switch now so this render already draws the editor and can focus it; hashchange re-renders the same page.
    if (S.page !== "styles") { S.page = "styles"; location.hash = "#styles"; }
    S.styleEdit = { id: "new", name: "", prompt: "" };
    S.styleConfirm = null;
    S.focusKey = "draft-name";
    render();
  },
  "edit-style"(btn) {
    const s = S.styles.find(x => x.id === btn.dataset.id);
    S.styleEdit = { id: s.id, name: s.name, prompt: s.prompt };
    S.styleConfirm = null;
    S.focusKey = "draft-name";
    render();
  },
  "cancel-edit"() {
    const id = S.styleEdit?.id;
    S.styleEdit = null;
    S.focusKey = id && id !== "new" ? `style-${id}` : "new-style";
    render();
  },
  "save-style"() { saveStyle(); },
  "ask-delete-style"(btn) {
    S.styleConfirm = btn.dataset.id;
    S.focusKey = "cancel-del";
    render();
  },
  "cancel-delete-style"() {
    const id = S.styleConfirm;
    S.styleConfirm = null;
    S.focusKey = `style-${id}`;
    render();
  },
  "delete-style"(btn) {
    const id = btn.dataset.id;
    const s = S.styles.find(x => x.id === id);
    S.styles = S.styles.filter(x => x.id !== id);
    if (S.activeStyle === id) S.activeStyle = null;
    S.styleConfirm = null;
    S.focusKey = `style-${S.activeStyle || "none"}`;
    announce(`Deleted ${s.name}`);
    render();
  },

  expand(btn) {
    const id = btn.dataset.id;
    const opening = S.expanded !== id;
    S.expanded = opening ? id : null;
    S.menu = null;
    const p = provider(id);
    S.focusKey = opening ? `in-${id}-${p.kind === "cloud" ? "apiKey" : "endpoint"}` : `exp-${id}`;
    render();
  },
  menu(btn) {
    const id = btn.dataset.menu;
    if (S.menu === id) closeMenus(true);
    else openMenu(id);
  },
  "pick-llm"(btn) {
    const p = provider(btn.dataset.id);
    p.model = btn.dataset.value;
    S.menu = null;
    S.focusKey = `picker-${p.id}`;
    announce(`${p.name} model: ${p.model}`);
    render();
  },
  fetch(btn) { fetchModels(btn.dataset.id); },
  "provider-toggle"(btn) {
    const p = provider(btn.dataset.id);
    const turningOn = S.activeProvider !== p.id;
    const configured = (p.kind === "cloud" ? p.apiKey : p.endpoint).trim() !== "";
    if (turningOn && !configured) {
      S.expanded = p.id;
      S.focusKey = `in-${p.id}-${p.kind === "cloud" ? "apiKey" : "endpoint"}`;
      announce(`Add connection details to use ${p.name}`);
      render();
      return;
    }
    S.activeProvider = turningOn ? p.id : null;
    announce(`${p.name} ${turningOn ? "active" : "off"}`);
    animateSwitches(() => render());
  },

  "speech-toggle"() {
    S.speech.enabled = !S.speech.enabled;
    S.focusKey = "speech-switch";
    announce(`Transcription ${S.speech.enabled ? "on" : "off"}`);
    animateSwitches(() => render());
  },
  "toggle-engine"(btn) {
    const id = btn.dataset.id;
    S.speech.open[id] = !S.speech.open[id];
    S.focusKey = `engine-${id}`;
    render();
  },
  "pick-model"(btn) {
    const sp = S.speech;
    const id = btn.dataset.id;
    sp.selected = id;
    sp.confirmDelete = null;
    if (sp.downloaded[id]) {
      sp.inUse = id;
      announce(`Using ${fullName(id)}`);
    } else if (sp.download && sp.download.id === id) {
      sp.download.use = true;
      announce(`${fullName(id)} will be used once it's downloaded`);
    } else {
      announce(`${fullName(id)} isn't downloaded yet`);
    }
    S.focusKey = `model-${id}`;
    render();
  },
  dl(btn) { startDownload(btn.dataset.id, false); },
  "dl-use"(btn) { startDownload(btn.dataset.id, true); },
  "dl-cancel"() {
    const sp = S.speech;
    const id = sp.download.id;
    clearInterval(dlTimer);
    announce(`${fullName(id)} download canceled`);
    sp.download = null;
    sp.selected = sp.inUse;
    S.focusKey = `dl-${id}`;
    render();
  },
  "dl-dismiss"() {
    const sp = S.speech;
    sp.selected = sp.inUse;
    S.focusKey = `model-${sp.inUse}`;
    render();
  },
  "ask-delete-model"(btn) {
    const sp = S.speech;
    sp.confirmDelete = btn.dataset.id;
    if (!sp.downloaded[sp.selected]) sp.selected = sp.inUse;   // one inline prompt at a time
    S.focusKey = "cancel-del-model";
    render();
  },
  "cancel-delete-model"() {
    const id = S.speech.confirmDelete;
    S.speech.confirmDelete = null;
    S.focusKey = `del-${id}`;
    render();
  },
  "delete-model"(btn) {
    const sp = S.speech;
    const id = btn.dataset.id;
    const m = model(id);
    const wasInUse = sp.inUse === id;
    delete sp.downloaded[id];
    sp.confirmDelete = null;
    if (wasInUse) {
      sp.inUse = FALLBACK_MODEL;
      sp.open[model(FALLBACK_MODEL).engine.id] = true;
    }
    if (sp.selected === id) sp.selected = sp.inUse;
    S.focusKey = `dl-${id}`;
    const note = `Deleted <b>${fullName(id)}</b> · ${fmtBytes(m.bytes)} freed${wasInUse ? ` · now using ${fullName(sp.inUse)}` : ""}`;
    announce(note.replace(/<\/?b>/g, ""));
    render();
    showNotice(note);
  },

  "pick-lang"(btn) {
    S.settings.language = btn.dataset.value;
    S.menu = null;
    S.focusKey = "lang";
    render();
  },
  "mute-toggle"() {
    S.settings.muteWhileRecording = !S.settings.muteWhileRecording;
    animateSwitches(() => render());
  },
  "login-toggle"() {
    S.settings.launchAtLogin = !S.settings.launchAtLogin;
    animateSwitches(() => render());
  },
  "clear-ask"() { S.settings.clearConfirm = true; S.focusKey = "clear-cancel"; render(); },
  "clear-cancel"() { S.settings.clearConfirm = false; S.focusKey = "clear-ask"; render(); },
  "clear-all"() {
    S.entries = [];
    S.undo = null;
    S.settings.clearConfirm = false;
    S.focusKey = "clear-ask";
    announce("History cleared");
    render();
  },
};

// Lets a switch's knob stretch across before the page re-renders under it.
function animateSwitches(then) {
  const want = {
    "speech-switch": S.speech.enabled,
    "mute-switch": S.settings.muteWhileRecording,
    "login-switch": S.settings.launchAtLogin,
    ...Object.fromEntries(S.providers.map(p => [`switch-${p.id}`, S.activeProvider === p.id])),
  };
  let moved = false;
  document.querySelectorAll(".switch[data-key]").forEach(sw => {
    const on = want[sw.dataset.key];
    if (on === undefined || String(on) === sw.getAttribute("aria-checked")) return;
    sw.setAttribute("aria-checked", String(on));
    moved = true;
  });
  if (moved && !reducedMotion()) setTimeout(then, 300);
  else then();
}

// ───────────── Stage (not part of the app) ─────────────

const STAGE_DEFAULTS = { theme: "paper", font: "bricolage" };

function setStage(kind, value, save = true) {
  document.documentElement.dataset[kind] = value;
  document.querySelectorAll(`[data-stage="${kind}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.value === value)));
  if (save) { try { localStorage.setItem(`shh-ink-${kind}`, value); } catch {} }
}

for (const kind of Object.keys(STAGE_DEFAULTS)) {
  let saved = null;
  try { saved = localStorage.getItem(`shh-ink-${kind}`); } catch {}
  const ok = saved && document.querySelector(`[data-stage="${kind}"][data-value="${saved}"]`);
  setStage(kind, ok ? saved : STAGE_DEFAULTS[kind], false);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-stage]");
  if (!b) return;
  setStage(b.dataset.stage, b.dataset.value);
  requestAnimationFrame(() => moveTab(false));   // font metrics can shift the rows
});

// ───────────── Events ─────────────

addEventListener("pointerdown", () => { document.documentElement.dataset.input = "pointer"; }, true);
addEventListener("keydown", () => { document.documentElement.dataset.input = "keyboard"; }, true);

document.addEventListener("pointerdown", e => {
  if (S.menu && !e.target.closest(".picker-wrap")) closeMenus(false);
}, true);

document.addEventListener("click", e => {
  const target = e.target.closest("[data-action]");
  if (!target || !ACTIONS[target.dataset.action]) return;
  if (target.matches(".prov-main") && e.target.closest(".disclosure")) return;
  e.preventDefault();
  // A pick from a row menu closes it first, then hands focus back to its "…" button.
  const fromMenu = target.closest(".menu-row") ? S.menu : null;
  if (fromMenu) S.menu = null;
  ACTIONS[target.dataset.action](target, e);
  if (fromMenu && (!document.activeElement || document.activeElement === document.body)) {
    $(`[data-menu="${fromMenu}"]`)?.focus({ preventScroll: true });
  }
});

// Right-click a row for the same actions as its "…" button.
document.addEventListener("contextmenu", e => {
  const row = e.target.closest("[data-row-menu]");
  if (!row || e.target.closest("input, textarea")) return;
  const id = row.dataset.rowMenu;
  if (!$(`[data-menu="${id}"]`)) return;
  e.preventDefault();
  document.documentElement.dataset.input = "pointer";
  if (S.menu !== id) openMenu(id);
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "search") {
    S.search = t.value;
    refreshHistory();
  } else if (t.dataset.draft) {
    S.styleEdit[t.dataset.draft] = t.value;
    const save = $('[data-key="save-style"]');
    if (save) save.disabled = !S.styleEdit.name.trim();
  } else if (t.dataset.field) {
    const p = provider(t.dataset.id);
    p[t.dataset.field] = t.value;
    p.status = null;
    const meta = t.closest(".prov").querySelector(".prov-meta");
    if (meta) meta.innerHTML = providerMeta(p);
  }
});

document.addEventListener("keydown", e => {
  const t = e.target;
  const mod = e.metaKey || e.ctrlKey;

  if (mod && e.key.toLowerCase() === "f") {
    e.preventDefault();
    if (S.page !== "home") { S.focusKey = "search"; location.hash = "#home"; }
    else $("#search")?.focus();
    return;
  }
  if (mod && e.key.toLowerCase() === "n" && !S.styleEdit) {
    e.preventDefault();
    ACTIONS["new-style"]();
    return;
  }
  if (mod && e.key === "Enter" && t.dataset.draft) {
    e.preventDefault();
    saveStyle();
    return;
  }

  const menu = t.closest(".menu");
  if (menu) {
    const items = [...menu.querySelectorAll(".menu-item")];
    const at = items.indexOf(document.activeElement);
    const go = j => items[(j + items.length) % items.length].focus();
    if (e.key === "ArrowDown") { e.preventDefault(); go(at + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); go(at - 1); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(items.length - 1); }
    else if (e.key === "Escape") { e.preventDefault(); closeMenus(true); }
    else if (e.key === "Tab") closeMenus(false);
    return;
  }
  if (t.matches('[aria-haspopup="menu"]') && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    openMenu(t.dataset.menu);
    return;
  }

  if (t.matches('[role="radio"]') && ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    e.preventDefault();
    const radios = [...t.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]')];
    const step = e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1;
    const next = radios[(radios.indexOf(t) + step + radios.length) % radios.length];
    ACTIONS[next.dataset.action](next);
    return;
  }

  if (t.matches(".conn .input") && e.key === "Enter") {
    e.preventDefault();
    fetchModels(t.dataset.id);
    return;
  }

  if (e.key === "Escape") {
    if (S.styleEdit) { e.preventDefault(); ACTIONS["cancel-edit"](); }
    else if (S.styleConfirm) { e.preventDefault(); ACTIONS["cancel-delete-style"](); }
    else if (S.settings.clearConfirm) { e.preventDefault(); ACTIONS["clear-cancel"](); }
    else if (S.speech.confirmDelete) { e.preventDefault(); ACTIONS["cancel-delete-model"](); }
    else if (t.closest(".conn")) { e.preventDefault(); ACTIONS.expand({ dataset: { id: S.expanded } }); }
    else if (t.id === "search" && S.search) { e.preventDefault(); ACTIONS["clear-search"](); }
  }
});

document.fonts?.ready.then(() => moveTab(false));

window.addEventListener("hashchange", () => {
  S.page = pageFromHash();
  S.menu = null;
  render();
});

render();
</script>
</body>
</html>
